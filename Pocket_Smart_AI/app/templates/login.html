<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PocketSmart AI - Login</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-header">

                <h1>PocketSmart AI</h1>

                <p>
                    Smart Budget &
                    Recommendation Assistant
                </p>

            </div>


            <!-- ERROR MESSAGE -->

            {% if error %}

            <div class="error-message">
                {{ error }}
            </div>

            {% endif %}


            <!-- LOGIN FORM -->

            <form
                action="/auth/login"
                method="POST"
                id="loginForm"
            >

                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>

            </form>


            <!-- REGISTER LINK -->

            <div class="auth-footer">

                <p>
                    Don't have an account?
                    <a href="/auth/register">
                        Create Account
                    </a>
                </p>

            </div>

        </div>

    </div>


    <!-- LOGIN JAVASCRIPT -->

    <script>

        const loginForm =
            document.getElementById("loginForm");

        loginForm.addEventListener(
            "submit",
            function () {

                console.log(
                    "Login form submitted"
                );

            }
        );

    </script>

</body>

</html>
